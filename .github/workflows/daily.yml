name: daily-retrain

# Training pipeline, once a day.
#
# Pulls the full feature groups from Hopsworks, retrains all three horizons
# (both heads), and registers the results. No "only if better" gate: inference
# selects the best registered version by metric, so a worse retrain is recorded
# but never served. The comparison is printed in the log either way.

on:
  schedule:
    # 02:40 UTC = 07:40 PKT. After the hourly job has landed the overnight
    # data, and off the top of the hour where GitHub's scheduler is busiest.
    - cron: "40 2 * * *"
  workflow_dispatch:

concurrency:
  group: daily-retrain
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 90        # RandomForest across 3 horizons x 4 folds is slow

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Retrain and register
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
        run: python -m pipelines.daily

      - name: Commit metrics
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/holdout_summary.csv reports/model_comparison.csv \
                  reports/last_train.json
          git diff --staged --quiet || git commit -m "retrain $(date -u +'%Y-%m-%d')"
          git push

      - name: Upload model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: models-${{ github.run_id }}
          path: |
            models/
            reports/
          retention-days: 14