name: daily-retrain

# Training pipeline, once a day.
#
# Pulls the full feature groups from Hopsworks, retrains all three horizons
# (both heads), and registers the results. No "only if better" gate: inference
# selects the best registered version by metric, so a worse retrain is recorded
# but never served. The comparison is printed in the log either way.
#
# Model registration retries internally - the Hopsworks metadata cluster
# intermittently returns HTTP 500 mid-upload, which previously left the
# registry half-populated.

on:
  schedule:
    # 02:40 UTC = 07:40 PKT. After the overnight hourly runs have landed data,
    # and off the top of the hour where GitHub's scheduler is busiest.
    - cron: "40 2 * * *"
  workflow_dispatch:

concurrency:
  group: daily-retrain
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 90        # RandomForest across 3 horizons x 4 folds is slow

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Retrain and register
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
        run: python -m pipelines.daily

      - name: Commit metrics
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add reports/holdout_summary.csv reports/model_comparison.csv \
                  reports/last_train.json
          if git diff --staged --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "retrain $(date -u +'%Y-%m-%d')"

          # Training rewrites tracked artifacts this step does not stage -
          # models/*.joblib and the metadata JSONs - which left the tree dirty
          # and made every rebase attempt fail with "You have unstaged
          # changes". Set them aside for the duration of the push. No need to
          # restore: the models are already in the Hopsworks registry and
          # uploaded as run artifacts, and the runner is discarded anyway.
          git stash --include-untracked || true

          # This job can run for the best part of an hour, during which the
          # hourly workflow pushes forecast commits to main. A plain push is
          # then rejected as non-fast-forward - which failed the job even
          # though training and registration had already succeeded. Both
          # workflows only touch generated files under reports/, so rebasing
          # can never conflict semantically.
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin main; then
              echo "pushed on attempt $i"
              exit 0
            fi
            echo "push attempt $i failed, retrying in 10s"
            sleep 10
          done
          echo "could not push after 5 attempts"
          exit 1

      - name: Upload model artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: models-${{ github.run_id }}
          path: |
            models/
            reports/
          retention-days: 14